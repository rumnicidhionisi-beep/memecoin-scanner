# ============================================================
#  Memecoin Narrative Scanner — ρυθμίσεις
#  Άλλαξε ό,τι θέλεις εδώ. Δεν χρειάζεται να αγγίξεις κώδικα.
# ============================================================

# --- X / Twitter ---------------------------------------------
# tier 1 = όταν γράφουν κάτι, γίνεται memecoin μέσα σε λεπτά
# tier 2 = μεγάλοι KOLs / crypto λογαριασμοί
x:
  enabled: true
  include_replies: true        # οι απαντήσεις διασήμων είναι συχνά το πιο δυνατό σήμα
  poll_seconds: 60             # live mode: έλεγχος X κάθε 60''
  tier1:
    - elonmusk
    - realDonaldTrump
    - cz_binance
    - saylor
    - VitalikButerin
    - aeyakovenko        # Toly (Solana)
    - JDVance
    - WhiteHouse
  tier2:
    - pumpdotfun
    - a1lon9             # Alon (pump.fun)
    - MustStopMurad
    - blknoiz06          # Ansem
    - Orangie
    - cobie
    - DegenerateNews
    - WatcherGuru
    - tier10k
  # Viral tweets από οποιονδήποτε που μιλάνε για memecoin
  viral_search:
    enabled: true
    query: '("pump.fun" OR memecoin OR "new coin") lang:en'
    min_likes: 1000

# --- TikTok (μέσω Apify) ---------------------------------------
tiktok:
  enabled: true
  every_minutes: 180          # κάθε 3 ώρες (για να μη ξοδεύεις)
  hashtags: [memecoin, pumpfun, solana, memecoins, cryptotok]
  results_per_hashtag: 20
  min_views: 20000
  max_age_hours: 24

# --- Ειδήσεις (RSS, δωρεάν) -----------------------------------
news:
  enabled: true
  feeds:
    - https://news.google.com/rss/search?q=memecoin+when:1d&hl=en-US&gl=US&ceid=US:en
    - https://news.google.com/rss/search?q=%22Elon+Musk%22+when:1d&hl=en-US&gl=US&ceid=US:en
    - https://news.google.com/rss/search?q=Trump+crypto+when:1d&hl=en-US&gl=US&ceid=US:en
    - https://cointelegraph.com/rss
    - https://decrypt.co/feed
  must_contain_any: [memecoin, meme coin, musk, trump, viral, pump.fun, solana, dog, cat, frog]

# --- Αντιστοίχιση αφηγήματος -> νόμισμα ----------------------
matching:
  narrative_ttl_hours: 24      # πόσο μένει «ζωντανό» ένα αφήγημα
  watch_minutes: 90            # φρέσκα αφηγήματα: ψάχνουμε token σε ΚΑΘΕ κύκλο
  max_token_age_hours: 48
  min_market_cap: 10000        # νόμισμα πάνω σε είδηση: το πιάνουμε από $10K
  min_liquidity_usd: 4000
  min_volume_1h_usd: 2000

# --- On-chain scanner (DexScreener) ---------------------------
# Δύο «λωρίδες»: early = γρήγορα νομίσματα που πέρασαν $50K μέσα στην πρώτη ώρα,
# survivors = τα κριτήρια 48 ωρών που είχαμε.
onchain:
  enabled: true
  max_vol_liq_ratio_24h: 30    # πάνω από αυτό = πιθανό fake volume
  early:
    enabled: true
    max_age_hours: 1
    min_market_cap: 50000
    min_liquidity_usd: 8000
    min_volume_1h_usd: 15000
    min_avg_trade_usd: 15      # όγκος 1h / συναλλαγές 1h -> κόβει micro-bots
    min_price_change_1h: 0
  survivors:
    enabled: true
    min_age_hours: 1
    max_age_hours: 48
    min_market_cap: 80000
    min_liquidity_usd: 15000
    min_volume_1h_usd: 20000
    min_avg_trade_usd: 15
    min_price_change_1h: 1

# --- Ασφάλεια (RugCheck, δωρεάν) ------------------------------
safety:
  max_rugcheck_score: 60       # 0 = ασφαλές, 100 = πολύ ριψοκίνδυνο
  reject_if_mint_authority: true
  reject_if_freeze_authority: true
  max_top10_pct: 30
  check_x_account_age: true    # λογαριασμός X ίδιας ηλικίας με το token = σημάδι rug
  min_x_account_age_days: 7

# --- pump.fun (live mode) -------------------------------------
pumpfun:
  watch_new_tokens: true       # νέο token με όνομα από φρέσκο αφήγημα -> μπαίνει σε παρακολούθηση
  early_warning: true          # μήνυμα ⚡ τη στιγμή που φτιάχνεται (μόνο για tier1 αφηγήματα)
  watch_hours: 6

# --- Ειδοποιήσεις --------------------------------------------
alerts:
  min_score: 55                # κάτω από αυτό δεν στέλνει άμεσο μήνυμα (μπαίνει όμως στη σύνοψη)
  hot_score: 80                # 🔥
  explain: true                # ο Claude γράφει: γιατί βγήκε, τι έγινε, περιθώριο, πόσο νωρίς
  narrative_only_alerts: true  # «ο Musk έγραψε X — δεν υπάρχει ακόμα token»
  digest_every_minutes: 30     # σύνοψη στο Telegram κάθε 30' (βάλε 60 για κάθε ώρα)
  digest_send_empty: false     # αν δεν βρέθηκε τίποτα, να μη στέλνει
