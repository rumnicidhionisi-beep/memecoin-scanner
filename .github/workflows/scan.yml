name: Memecoin scanner

# Κάθε τρέξιμο = «βάρδια» ~5h45' σε LIVE mode (X κάθε 2', pump.fun σε πραγματικό χρόνο,
# πλήρης σάρωση κάθε 5'). Στο τέλος ξεκινάει μόνο του την επόμενη βάρδια.
# Το cron είναι μόνο εφεδρεία, αν σπάσει η αλυσίδα.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Στείλε δοκιμαστικό μήνυμα στο Telegram"
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache/restore@v4
        with:
          path: state
          key: scanner-state-${{ github.run_id }}
          restore-keys: scanner-state-

      - name: Test Telegram
        if: ${{ inputs.test_telegram }}
        run: python -m scanner.main --test-telegram

      - name: Live scanner (βάρδια ~5h40')
        if: ${{ !inputs.test_telegram }}
        run: python -m scanner.main --live --every 5 --duration 20400

      - run: mkdir -p state

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: scanner-state-${{ github.run_id }}

      - name: Επόμενη βάρδια
        if: ${{ always() && !inputs.test_telegram }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scan.yml --ref main -R ${{ github.repository }}
